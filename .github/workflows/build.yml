name: Build and test

on:
  push:
  pull_request:

jobs:
  build:
    name: Build (${{ matrix.compiler }})
    environment: numeric-methods-cpp
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: gcc
            cc: gcc
            cxx: g++
          - compiler: clang
            cc: clang
            cxx: clang++

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build --parallel

      - name: Upload test executables
        uses: actions/upload-artifact@v4
        with:
          name: tests-${{ matrix.compiler }}
          path: |
            dist/bin/*-test
            dist/bin/*-tests
          if-no-files-found: warn

  test:
    name: Test (${{ matrix.compiler }})
    environment: numeric-methods-cpp
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compiler:
          - gcc
          - clang

    steps:
      - name: Download test executables
        uses: actions/download-artifact@v4
        with:
          name: tests-${{ matrix.compiler }}
          path: dist/bin

      - name: Run tests
        run: |
          mapfile -d '' test_files < <(
            find dist/bin -type f \( -name '*-test' -o -name '*-tests' \) -print0
          )

          if [ "${#test_files[@]}" -eq 0 ]; then
            echo "::warning::No test files with a -test suffix were found"
            exit 0
          fi

          for test_file in "${test_files[@]}"; do
            chmod +x "$test_file"
            "$test_file"
          done

  notify:
    name: Notify Telegram
    runs-on: ubuntu-latest
    environment: numeric-methods-cpp

    needs:
      - build
      - test

    if: always()

    steps:
      - name: Get build job results
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          curl --fail-with-body \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${REPOSITORY}/actions/runs/${RUN_ID}/jobs?per_page=100" \
            > jobs.json

      - name: Create Telegram message
        shell: bash
        run: |
          {
            echo "🚀 GitHub Actions"
            echo ""
            echo "Repository: ${{ github.repository }}"
            echo "Branch: ${{ github.ref_name }}"
            echo "Author: ${{ github.actor }}"
            echo ""
            echo "Build results:"
            echo ""

            for compiler in gcc clang; do
              result=$(jq -r \
                --arg name "Build (${compiler})" \
                '.jobs[] | select(.name == $name) | .conclusion' \
                jobs.json)

              case "$result" in
                success)
                  echo "${compiler}: ✅ SUCCESS"
                  ;;
                failure)
                  echo "${compiler}: ❌ FAILURE"
                  ;;
                cancelled)
                  echo "${compiler}: ⚠️ CANCELLED"
                  ;;
                skipped)
                  echo "${compiler}: ⏭️ SKIPPED"
                  ;;
                *)
                  echo "${compiler}: ❓ ${result}"
                  ;;
              esac
            done

            echo ""
            echo "Test results:"
            echo ""

            for compiler in gcc clang; do
              result=$(jq -r \
                --arg name "Test (${compiler})" \
                '.jobs[] | select(.name == $name) | .conclusion' \
                jobs.json)

              case "$result" in
                success)
                  echo "${compiler}: ✅ SUCCESS"
                  ;;
                failure)
                  echo "${compiler}: ❌ FAILURE"
                  ;;
                cancelled)
                  echo "${compiler}: ⚠️ CANCELLED"
                  ;;
                skipped)
                  echo "${compiler}: ⏭️ SKIPPED"
                  ;;
                *)
                  echo "${compiler}: ❓ ${result}"
                  ;;
              esac
            done

            echo ""
            echo "See workflow:"
            echo "https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          } > message.txt

          cat message.txt

      - name: Send Telegram message
        uses: appleboy/telegram-action@v1
        with:
          to: ${{ secrets.TELEGRAM_CHAT_ID }}
          token: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          message_thread_id: ${{ secrets.TELEGRAM_THREAD_ID }}
          message_file: message.txt
